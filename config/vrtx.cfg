#@@ note THIS IS THE TEMPLATE, not a config file: do not copy it into your config folder by hand.
#@@ note install.sh builds your vrtx.cfg from it (python3 config/build_config.py --help), switching on the
#@@ note calibration method you choose and writing the tools, docks and T commands for your number of tools.
#@@ note Lines between "#@@ if full" / "#@@ if hotend" and "#@@ endif" are kept only for that kind of tool changer:
#@@ note full = every tool is a full toolhead, hotend = only the hotend is swapped (motor and part fans on the carriage).
# =============================================================================
# VRTX: your configuration. This is the ONE file you edit.
# =============================================================================
# printer.cfg includes it:    [include VRTX/vrtx.cfg]
#
# VRTX works with any board. Everything is set up in this file: either define
# your tools' heaters, fans and switches in sections 5 and 6, or point sections
# 5 and 6 at a config file of your own (the one that came with your board) with
# an include line. VRTX refers to the hardware by name only.
#
# Everything VRTX needs from you is in this file, in seven sections:
#
#   1  What to load       switch optional VRTX parts on or off
#   2  Settings           the calibration position and the other VRTX settings
#   3  VRTX's probes    the Nudge probe, the optional Z switch
#   4  Toolchanger        the [toolchanger] section with the dock hooks
#   5  Tools              the hardware of your tools, and one [tool Tn] each
#   6  Switches           carriage and dock switches (optional)
#   7  Dock positions     where every dock is
#
# Work through the sections from top to bottom. Search for  ...  : Klipper
# refuses to start while a section you switched on still has "..." in it.
#
# The order of the sections matters (VRTX's T commands must load before the
# tools, your settings after VRTX), so add new sections at the end.
#
# TWO CALIBRATION METHODS are in this file. The installer asked you which one you
# prefer and switched that one on; the other one is there, switched off, in case you
# change your mind. They are the blocks that start with a line like
#     # ------ NUDGE calibration ... ------        or        # ------ CAMERA calibration ... ------
# (sections 1, 2 and 3). To change the method, select every line of the active block
# and put a hash sign in front of it, then select every line of the other block and
# remove ONE hash sign from the start of each line (in an editor: "toggle comment").
# Then restart Klipper. Everything else in this file serves both methods.
#
# The installer also built the tools of this file for the number of tools you gave. To
# add a tool later, copy the last [tool Tn], dock switch and dock section, change the
# numbers (up to T9), and see the note at the T command include in section 1.
#
# core/ in this folder is a link to the VRTX download and is replaced by
# updates: never edit anything in core/. Updates never touch this file; if the
# template changes, the new one is saved next to it as vrtx.cfg.new.
# Comments go on their own line, never behind a value. Restart Klipper after
# a change.

# ===========================================================================
# SECTION 1: WHAT TO LOAD
# VRTX's own macros, from core/. To leave a part out, put a hash sign in
# front of its [include] line.
# ===========================================================================

[include core/vrtx.cfg]
#@@ begin camera
## CAMERA calibration (method 2): the camera alignment macros VRTX_START, VRTX_LOAD_TOOL,
## VRTX_MOVE, VRTX_SET_TOOL and VRTX_END. Loads after core/vrtx.cfg.
#[include core/vrtx_camera.cfg]
#@@ end camera
# T commands, filament per tool, temperature buttons, tool change log.
# Loads before the tools (section 5), as it must.
#@@ tcommands
# M104 / M109 with a T parameter for slicers ("M104 T1 S220"). Needed for
# heater_generic tools; with one [extruderN] per tool Klipper already does it,
# but this file also feeds VRTX's standby temperature memory.
# Not together with beacon_heater_hooks.cfg: both define M104 and M109.
#[include core/vrtx_tool_heaters.cfg]
# Hotend swapper with ONE shared extruder motor: makes SET_PRESSURE_ADVANCE (OrcaSlicer,
# Mainsail, Fluidd) act on the shared motor. Only with variable_motor set in section 2,
# and not together with a SET_PRESSURE_ADVANCE macro of your own.
#@@ if hotend
# Your tool changer swaps only the hotend: switch this on once variable_motor is set.
#@@ endif
#[include core/vrtx_shared_extruder.cfg]
# Makes the plain RESUME (the Resume button) refuse after a failed tool change, so it
# cannot continue a print with the wrong tool. Only if you have NO RESUME macro of your
# own. With Mainsail or Fluidd do not include it (it would replace their RESUME); put
#   [gcode_macro _CLIENT_VARIABLE]
#   variable_user_resume_macro: "VRTX_RESUME_GUARD"
# in your printer.cfg instead. See core/docs/docking.md.
#[include core/vrtx_resume_guard.cfg]
# Docking: pick-up and drop-off for passive (Maxwell / kinematic) couplings.
# Leave it out, and empty section 7, if your changer brings its own
# dock macros; then point the hooks in section 4 (Toolchanger) at those.
[include core/vrtx_dock.cfg]

# ===========================================================================
# SECTION 2: SETTINGS
# Only the values that differ from the defaults. Every setting is explained at
# the top of core/vrtx.cfg and core/vrtx_tools_core.cfg.
# ===========================================================================

[gcode_macro _VRTX_SETTINGS]
variable_reference_tool: 0
# tool_parameter for klipper-toolchanger 2025.12.26 or newer,
# gcode_offset if your tool change macros call SET_GCODE_OFFSET from t<N>_offset_x/y/z
variable_offset_method: 'tool_parameter'
variable_safe_z: 30.0
#@@ begin nudge
## NUDGE calibration (method 1): where the nozzle of the reference tool hangs just above
## the middle of the Nudge pin (gcode coordinates). The nozzle tip must be well above the
## pin. 1 to 2 mm off is fine, the probing finds the centre itself.
#variable_nudge_x: 150.0
#variable_nudge_y: 5.0
#variable_nudge_z: 15.0
## Before the toolhead moves over the pin, and after the probing, it goes up to this many mm
## above nudge_z (or to safe_z, if that is higher), so that nothing runs into the pin.
## safe_z can stay as low as the rest of your printer needs. The nozzle of a tool whose
## offset is not measured yet may hang lower than the reference tool's: give it room.
#variable_nudge_clear_z: 10.0
#@@ end nudge
#@@ begin camera
## CAMERA calibration (method 2): X and Y are aligned by eye with a camera, Z is measured
## with the Z switch (section 3). The camera settings are in _VRTX_CAMERA_SETTINGS below.
#variable_calibration: 'camera'
#@@ end camera
# 0 = measure cold. 150 = heat every nozzle to 150 C first.
variable_cal_temp: 0
# 0 = VRTX_CALIBRATE ends with the tool mounted that was mounted when it started.
# 1 = it ends by putting the tool that is mounted into its dock (from the Nudge clear
# height) and then moves the carriage back to where it started. No tool is mounted then.
variable_park_after_calibrate: 0
# A measured offset larger than this is not saved (the tool is seated badly, or the
# wrong spot was probed). 10 mm for every axis unless you set limits per axis. A tight
# limit is a good guard once your tools are built:
#variable_max_offset_x: 2.0
#variable_max_offset_y: 2.0
#variable_max_offset_z: 3.0
# VRTX_CALIBRATE RUNS=n: warn when the runs of a tool differ by more than this (mm)
# between the smallest and the largest, and keep this much room (mm) around the Nudge
# when checking, before the calibration moves, that every tool can reach it.
#variable_run_range_warning: 0.05
#variable_nudge_margin: 1.0
# Only with a Z switch ([vrtx_z_probe] in section 3): where the nozzle of the reference
# tool hangs above the middle of the switch (gcode coordinates). Needed for the camera
# method as well, it measures Z with the switch.
#variable_z_switch_x: 60.0
#variable_z_switch_y: 20.0

#@@ begin camera
## CAMERA calibration: the settings of the camera alignment.
#[gcode_macro _VRTX_CAMERA_SETTINGS]
## Approximate position of the camera centre in gcode coordinates, where the first
## alignment starts. The exact position is saved when you save the reference tool.
#variable_camera_x: 100.0
#variable_camera_y: 30.0
## Nozzle height where the tip is in focus (gcode coordinates). The exact height is saved
## together with the reference tool.
#variable_focus_z: 8.0
## Largest single move of VRTX_MOVE in mm
##variable_xy_move_limit: 2.0
##variable_z_move_limit: 1.0
## Brightness of the LED ring around the camera, 0.0 to 1.0 (needs [neopixel vrtx_led] in section 3)
##variable_led_brightness: 1.0
## Camera cooling: the part cooling fan of the tool in front of the camera runs at this
## speed (0.0 to 1.0) while the bed is hotter than the given temperature, so that the heat
## haze does not blur the picture. 0 = off.
##variable_camera_cooling_fan_speed: 0.0
##variable_camera_cooling_bed_temp: 50
#@@ end camera

[gcode_macro _VRTX_TOOLS_SETTINGS]
#@@ if hotend
# Your tool changer swaps only the hotend (your answer at the installation).
variable_changer: 'hotend'
#@@ endif
# 'off': a tool that is put away is switched off. 'standby': it goes to standby_temp.
variable_standby_mode: 'off'
variable_standby_temp: 150.0
# Temperature buttons on the page, "name:temperature" separated by commas.
variable_presets: 'PLA:215, PETG:240, ABS:255'
# Mainsail's Spoolman panel (one spool per tool) and VRTX's filament per tool are
# kept in step; False switches that off.
#variable_mainsail_spools: True
# A tool can have its own buttons, for example T3:
#variable_presets_t3: 'TPU:225'
# OrcaSlicer filament sync (see the README). False switches it off.
#variable_slicer_sync: False
# Hotend swapper with one shared extruder motor (every hotend keeps its own filament
# loaded). Needs the hooks in section 4. See core/docs/hardware.md.
#   motor: the shared motor, the name of its [extruder_stepper] in your board file,
#          or of the [extruder] that holds the motor. The pressure advance and
#          rotation distance of the mounted tool are set on it (params_ lines of the
#          [tool Tn] sections), and with an [extruder_stepper] it is handed to the tool.
#   retract: mm of filament pulled back on the tool that is put away, 0 = off. During
#          a print only. Pushed back when the tool is mounted again. Set the slicer's
#          tool change retraction to 0 when you use it.
#@@ if hotend
# Your tool changer swaps only the hotend: set this to the name of your shared motor.
#@@ endif
#variable_motor: 'shared_drive'
#variable_retract: 1.5
#variable_retract_speed: 40
#variable_unretract_speed: 25
# Prime over a brush or into a purge bucket: a macro of yours that gets T= LENGTH= SPEED=,
# moves there, pushes LENGTH mm, wipes. first_prime: extra mm the first time a tool is
# used in a print (call VRTX_PRIMED_RESET at the start of PRINT_START).
#variable_prime_macro: 'MY_PRIME_AT_BRUSH'
#variable_first_prime: 20
# M109 (vrtx_tool_heaters.cfg) waits for target - wait_below ... target + wait_above
# instead of Klipper's slower "flat within 1 degree" wait. 0 = Klipper's wait.
#variable_wait_below: 2
#variable_wait_above: 3
# A failed tool change during a print pauses it (needs error_gcode in section 4 and a
# [pause_resume] section). VRTX_RESUME then brings the changer back after you fixed
# the tool by hand. error_notify: a macro of yours that gets MSG=<text>, for a message
# to your phone.
#variable_pause_on_error: True
#variable_error_notify: 'MY_NOTIFY'
# Find the tool on the carriage from the switches when Klipper starts
# (needs the carriage switch and a dock switch for every tool, section 6).
#variable_auto_init: True
# A tool changed by hand outside a tool change (same switches): silent = the changer
# follows the switches by itself when not printing, next = the next T command follows
# them first, off = no check. During a print a hand change pauses it (Recover mounts the
# tool the print needs). manual_sync_delay: seconds the switches must be still.
#variable_manual_sync: 'silent'
#variable_manual_sync_delay: 5.0

# ===========================================================================
# SECTION 3: VRTX'S PROBES
# The calibration equipment that belongs to VRTX itself: the Nudge probe and
# the optional Z switch. Set their pins. The hardware of your tools does NOT
# go here, see sections 5 and 6.
# ===========================================================================

#@@ begin nudge
## The Nudge probe (https://github.com/zruncho3d/nudge). Its switch is wired like
## a Z endstop. This section comes from klipper-toolchanger and does the probing.
#[tools_calibrate]
## Pin of the Nudge switch. Wired normally closed to ground (the usual way):
## ^PF5 . For a normally open wiring use ^!PF5 . Test it by hand: with the
## Nudge at rest VRTX_NUDGE_QUERY must say "open", with the pin pushed
## aside it must say "TRIGGERED". If it is the other way round, add or
## remove the ! .
#pin: ^PF5
## Sideways travel speed between the probing moves, mm/s
#travel_speed: 20
## How far the nozzle starts away from the pin for each side, mm.
## Nozzle diameter / 2 + pin radius + a few mm.
#spread: 7
## How far the nozzle goes down beside the pin to touch it, mm
#lower_z: 1.0
## Probing speed (slow = accurate) and the retract speed between samples, mm/s
#speed: 2
#lift_speed: 4
## Lift after the probing: must be more than the height difference between the tools
#final_lift_z: 6
#sample_retract_dist: 2
#samples: 5
#samples_tolerance: 0.05
#samples_result: median
#@@ end nudge

#@@ begin camera
## CAMERA calibration: the camera is not set up here. It is a webcam in Moonraker (the
## Alignment tab of the VRTX page shows it). Optional: an LED ring around the lens that
## VRTX switches on during the alignment, on its own pin:
###[neopixel vrtx_led]
###pin: ...
###chain_count: 12
###color_order: GRB
###initial_RED: 0.0
###initial_GREEN: 0.0
###initial_BLUE: 0.0
## The camera method measures Z with the Z switch below. Without it only X and Y are
## aligned and the Z offsets stay as they are.
#@@ end camera

# A separate switch that every nozzle presses from above. Z is then measured with it
# (z_source auto). With the Nudge it is optional: the switch is more repeatable than the
# Nudge in Z, leave it out if the Nudge is good enough for you. With the camera method
# it is how Z is measured.
#[vrtx_z_probe]
## switch pin, normally closed to ground with the pull-up ^ ; add ! to invert
#pin: ^PG15
#speed: 3
#lift_speed: 10
#samples: 5
#sample_retract_dist: 1.5
#samples_result: median
#samples_tolerance: 0.02
#samples_tolerance_retries: 3
## fallback search distance for VRTX_Z_PROBE typed by hand
#max_travel: 6

# Needed for the saved offsets, dock teaching and filament. If printer.cfg
# already has a [save_variables] section, remove one of the two.
[save_variables]
filename: ~/printer_data/config/variables.cfg

# ===========================================================================
# SECTION 4: TOOLCHANGER
# The [toolchanger] section (klipper-toolchanger). Move any [toolchanger]
# options you already have in printer.cfg into this section.
#
# The dock hooks below run VRTX's dock macros for every tool change. The
# long {% if %} parts hand over the position the print was at, so that the dock
# macros can go back there safely (sideways at safe height, then down).
# If your changer has its own dock macros, point the hooks at those instead.
# A [tool Tn] section with its own pickup_gcode / dropoff_gcode (even an empty
# one) overrides these.
# ===========================================================================

[toolchanger]
# The VRTX hooks. They do nothing until the matching setting is on (section 2):
#   before_change_gcode: retracts the tool that is put away (retract)
#   after_change_gcode:  hands the shared motor to the mounted tool, sets its
#                        pressure advance, pushes the filament back (motor, retract)
#   error_gcode:         a failed tool change during a print pauses the print
#                        instead of stopping it (pause_on_error)
before_change_gcode: VRTX_BEFORE_CHANGE
after_change_gcode: VRTX_AFTER_CHANGE T={tool.tool_number}
error_gcode: VRTX_TOOLCHANGE_ERROR
pickup_gcode:
    VRTX_DOCK_PICKUP T={tool.tool_number}{% if 'X' in restore_position %} RX={restore_position.X}{% endif %}{% if 'Y' in restore_position %} RY={restore_position.Y}{% endif %}{% if 'Z' in restore_position %} RZ={restore_position.Z}{% endif %}
dropoff_gcode:
    VRTX_DOCK_DROPOFF T={tool.tool_number}{% if pickup_tool is none %}{% if 'X' in restore_position %} RX={restore_position.X}{% endif %}{% if 'Y' in restore_position %} RY={restore_position.Y}{% endif %}{% if 'Z' in restore_position %} RZ={restore_position.Z}{% endif %}{% endif %}

# ===========================================================================
# SECTION 5: TOOLS
# One [tool Tn] section per tool (the installer wrote one for each of your
# tools, up to 10 tools are possible, T0 ... T9).
#
# VRTX defines no hardware. The heaters, thermistors, hotend fans and motors
# of your tools are set up in the config file of the board they are wired to
# (for example the file that came with your tool changer or tool board), and
# the [tool Tn] sections below only point at them by name. Include that file
# in printer.cfg BEFORE the VRTX line, or with one line here:
#[include ../my_tools.cfg]
# (next to printer.cfg, hence the ../). Examples of such board files, for full
# toolheads and for hotend swappers: core/docs/hardware.md
#@@ if hotend
#
# Hotend swapper: the extruder motor, the part cooling fans and the carriage
# switches stay on the carriage, in your carriage (toolhead) board's file. Keep
# the part cooling fans as its one [fan] (two fans on two pins: a [multi_pin]
# with both, and pin: multi_pin:<name> in [fan]); the tools get no fan of their own.
#@@ endif
#
# To take a tool out, put a hash sign in front of every line of its [tool]
# section and of its dock switch in section 6. Its saved offsets and filament
# stay saved. Klipper refuses to start while a [tool] points at a section that
# does not exist: check the names against your board file.
# ===========================================================================

# ---------------------------------------------------------------------------
# The tools. Each one only points at the sections of your board file by name.
#   extruder: the [extruder] / [extruderN] section of the tool (its heater,
#             and its motor if it has its own)
#@@ if full
#   fan:      optional, the part cooling fan, for example  fan_generic t0_part_fan
#@@ endif
#@@ if hotend
#   (no fan: the part cooling fans are the [fan] on the carriage, for every tool)
#@@ endif
# ---------------------------------------------------------------------------
#@@ each tool
[tool T{n}]
tool_number: {n}
extruder: {extruder}
#@@ if full
fan: fan_generic t{n}_part_fan
#@@ endif
#@@ if hotend
# Pressure advance and rotation distance of this tool, set on the shared motor
# whenever the tool is mounted (needs variable_motor in section 2)
#params_pressure_advance: 0.045
#params_pressure_advance_smooth_time: 0.04
#params_rotation_distance: 22.68
#@@ endif

#@@ end each

# ===========================================================================
# SECTION 6: SWITCHES
# Tool switches (optional): one on the carriage, pressed while any tool is
# attached, and one per dock, pressed while its tool sits in the dock.
# Pressed = tool present. A switch that is not defined is simply skipped, so
# without switches leave this section as it is.
# See core/docs/docking.md "Tool switches".
#
# Part 1: define the switches here, or skip it if your board file already
#         has them.
# Part 2: tell VRTX their names, only if they are not the names used in
#         Part 1 below (vrtx_head, vrtx_dock_t0, vrtx_dock_t1 and so on).
# ===========================================================================

# ---------------------------------------------------------------------------
# PART 1: the switches. Remove the hash signs and set your pins; add or remove
# ! in front of a pin if yours reads the other way (check with
# QUERY_BUTTON BUTTON=...).
# ---------------------------------------------------------------------------
# One switch on the carriage. release_gcode pauses a running print if the
# tool falls off.
#[gcode_button vrtx_head]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:
#release_gcode:
#    VRTX_DOCK_HEAD_RELEASED

# One switch per dock.
#@@ each dockswitch
#[gcode_button vrtx_dock_t{n}]
#pin: ^...
#debounce_delay: 0.1
#press_gcode:

#@@ end each

# ---------------------------------------------------------------------------
# PART 2: names of switches defined elsewhere (this adds to the
# _VRTX_TOOLS_SETTINGS of section 2). Without names here VRTX looks for
# vrtx_head and vrtx_dock_t0 ... vrtx_dock_t9.
# ---------------------------------------------------------------------------
[gcode_macro _VRTX_TOOLS_SETTINGS]
# The carriage switch. Its release_gcode should call
# VRTX_DOCK_HEAD_RELEASED so that a print pauses if the tool falls off.
#variable_head_switch: 'carriage_switch'
# One dock switch per tool, in tool order T0, T1, T2 ... separated by commas.
# Leave an entry empty for a tool without a dock switch.
#variable_dock_switches: 'dock_0, dock_1, dock_2, dock_3'

# ===========================================================================
# SECTION 7: DOCK POSITIONS
# Part 1: shared settings (speeds, safe height, default approach path).
# Part 2: one section per tool/dock, T0 to T9, with the position of that dock.
#
# All positions are raw toolhead (carriage) coordinates in mm, the same
# numbers the Mainsail position display shows when no tool offset is active.
# Nothing moves for a tool until its section says  variable_taught: 1
#
# Easy way to fill in a dock: jog the carriage by hand until the tool sits
# fully seated in its dock, then run   VRTX_DOCK_TEACH T=0   and paste the
# lines it prints into the section below. See core/docs/docking.md.
#
# Keep the quotes around the path strings.
# ===========================================================================

# ===========================================================================
# Part 1: shared settings
# ===========================================================================
[gcode_macro _VRTX_DOCK_SETTINGS]
description: VRTX dock: shared settings (edit the numbers in this file, not this macro)
# Height (raw Z, mm) at which the carriage may travel sideways across the
# docks. It must be higher than the tops of ALL tools sitting in their docks,
# and the bed/print must not be in the way either.
variable_safe_z: 40
# How the dock moves treat Z.
#   absolute  (default) the carriage goes up to safe_z, comes down to the Z of the dock
#             (park_z + dz of the path steps) and goes back to the print Z afterwards.
#   keep      for printers whose BED moves in Z: no dock move has a Z part at all. Z stays
#             where it is, safe_z and park_z are not used, the dz of a step is ignored
#             (write 0), VRTX_DOCK_TEACH stores no park_z.
#   lift      for printers whose BED moves in Z and must drop away from the docks: before
#             the dock moves Z goes up to safe_z if it is lower (the bed goes down), the
#             dock steps have no Z part (park_z and dz are not used, write 0) and Z goes
#             back to the print Z at the end. Z above safe_z is left where it is.
variable_z_mode: 'absolute'
# z_mode lift only: before the dock moves go at least this many mm above the print Z
# (also above safe_z), so that the way back comes in above the print and goes down
# straight onto it, also on high layers. 0 (default) = only safe_z.
variable_lift_min: 0
# Speeds in mm/s
# - travel_speed: free moves at safe height
# - z_speed: up and down moves in free space
# - approach_speed: moves between the approach steps
# - engage_speed: the last move into the dock position (keep it slow)
# - pullout_speed: moves away from the dock (keep it slow for the first steps)
variable_travel_speed: 200
variable_z_speed: 20
variable_approach_speed: 40
variable_engage_speed: 8
variable_pullout_speed: 8
# Pause in milliseconds once the coupling is fully seated, before pulling away
variable_seat_dwell: 300
# After a pickup, go back to where the print was (1) or leave that to the
# toolchanger (0). The macros do it safely: first sideways at safe height, then down.
variable_restore_move: 1
# Check the dock and carriage switches before and after every pickup and
# dropoff (1), or ignore them (0). Switches that are not configured are skipped.
variable_check_switches: 1
# Wait in milliseconds after the carriage has stopped before reading the
# switches, so that they have settled
variable_switch_settle: 300
# Before a change, count the tools: the carriage switch plus the dock switches must
# see exactly as many tools as there are. A tool that was knocked off or taken out
# between two changes stops the change before anything moves. Needs the carriage
# switch and a dock switch for every tool. 1 = check, 0 = do not.
variable_check_count: 1
# Acceleration of the dock moves in mm/s2, never above the print acceleration, which
# is put back afterwards (also after a failed change). 0 = leave the acceleration
# alone. fast: free moves, the approach and the way back to the print. slow: the last
# move into the dock, and the moves out of it (release, sideways).
variable_accel_fast: 0
variable_accel_slow: 0
# Acceleration of the free moves outside the docks: the lift to safe_z and the way back
# to the print. fast (default) = accel_fast, slow = accel_slow, print = the acceleration
# the print had, or a number in mm/s2. A path step can use print in its accel field too.
variable_travel_accel: 'fast'
# 1 = after a pickup that is followed by a first prime (first_prime with a prime_macro,
# section 2) the way back to the print waits until after the prime: the prime_macro goes
# from the dock straight to its brush. It can call VRTX_DOCK_RESTORE_PENDING when it is
# done (before it pushes the retract back); otherwise VRTX goes back after the prime.
# 0 = back to the print first, then the prime.
variable_prime_before_restore: 0
# For docks that are not passed over at a safe height (z_mode keep or lift): 1 = when the
# carriage is between the first step of the entry path and the docks, it first goes straight
# out to the line of that first step (along Y for docks at the front or back, along X for
# docks at the side), and only then sideways to it. 0 = straight to the first step.
variable_lane_guard: 0
# Default approach path for every dock, relative to the dock position.
# Format: steps separated by /, each step is dx,dy,dz[,speed[,v[,accel]]]
#   dx,dy,dz  distance from the dock position in mm
#   speed     optional, mm/s, empty = the default for that kind of move
#   v         optional, in a pickup path: check the tool detection pin there
#   accel     optional, fast, slow, print or mm/s2. Empty = fast on the approach, slow on the
#             way out. Needs accel_fast / accel_slow above, or a number.
# The steps run in order and the last move goes to the dock position itself.
# The FIRST step must be in free space where the carriage can come down to.
# Default: stand 25 mm in front of the dock (lower Y), then 5 mm in front, then go in.
variable_approach: "0,-25,0/0,-5,0"
# Own entry path for a pickup and for a dropoff, same format. Empty = use the approach
# path above. For docks where the way in is not the same for both, e.g. a dropoff that
# enters beside the dock and slides in, while a pickup goes in straight. A dock can have
# its own in its section below; the order is: the dock's own, the shared one, the approach.
variable_pickup_in: ""
variable_dropoff_in: ""
# Default path away from the dock after a pickup / after a dropoff, same format.
# Empty = walk the entry path of the same action backwards.
variable_pickup_out: ""
variable_dropoff_out: ""
gcode:


# ===========================================================================
# Part 2: the docks, one section per tool
# ===========================================================================
# variable_taught   0 = not set up yet (no motion), 1 = positions are valid
# variable_park_x/y/z   carriage position with the tool fully seated in its dock
#                   (park_z is not used when z_mode is keep or lift)
# variable_approach / pickup_in / dropoff_in / pickup_out / dropoff_out   only if this dock needs a
#                   path different from the shared default above, otherwise empty

#@@ each dockmacro
[gcode_macro _VRTX_DOCK_T{n}]
description: VRTX dock position of tool T{n}
variable_taught: 0
variable_park_x: 0.0
variable_park_y: 0.0
variable_park_z: 0.0
variable_approach: ""
variable_pickup_in: ""
variable_dropoff_in: ""
variable_pickup_out: ""
variable_dropoff_out: ""
gcode:

#@@ end each
